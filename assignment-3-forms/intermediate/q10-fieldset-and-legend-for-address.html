<body>
<h1>HTML Assignment 3 - Forms (Intermediate)</h1>
<h2>Q10. &lt;fieldset&gt; and &lt;legend&gt; for address details</h2>
<div class="demo">
<form onsubmit="event.preventDefault();alert('Form submitted')">
<fieldset><legend>Address</legend>
<label>Street: <input type="text" name="street"></label><br>
<label>City: <input type="text" name="city"></label><br>
<label>State: <input type="text" name="state"></label><br>
<label>PIN: <input type="text" name="pin" pattern="[0-9]{6}" title="6-digit PIN"></label>
</fieldset>
</form>
</div>
