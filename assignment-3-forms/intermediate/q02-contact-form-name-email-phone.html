<h2>Q2. Contact form: Name, Email, Phone, Message</h2>
<div class="demo">
<form onsubmit="event.preventDefault();alert('Form submitted')">
<label for="cn">Name:</label> <input type="text" id="cn" required><br>
<label for="ce">Email:</label> <input type="email" id="ce" required><br>
<label for="cp">Phone:</label> <input type="tel" id="cp"><br>
<label for="cmsg">Message:</label><br><textarea id="cmsg" rows="4" cols="40"></textarea><br>
<button type="submit">Send</button>
</form>
