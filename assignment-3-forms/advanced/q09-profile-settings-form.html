<head>
<meta charset="UTF-8">

<title>Q9 - Profile settings form</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:20px auto;padding:0 16px;line-height:1.5}
section.q{border:1px solid #ccc;border-radius:6px;padding:12px 16px;margin:16px 0}
h2{font-size:1.05em;color:#1f4e79}
.demo{background:#f7f7f7;padding:10px;margin-top:8px}
label{display:inline-block;margin:4px 0}
input,select,textarea,button{margin:4px 0}
nav.h a{margin-right:12px}
svg,canvas{background:#fff}
figure{display:inline-block;margin:6px}
.err{color:#b00020;font-size:.9em}
</style>
</head>
<body>
<h1>HTML Assignment 3 - Forms (Advanced)</h1>
<h2>Q9. Profile settings form</h2>
<div class="demo">
<form onsubmit="event.preventDefault();alert('Form submitted')">
<label>Name: <input type="text" id="pf_n" value="Your Name"></label><br>
<label>Profile picture: <input type="file" id="pf_f" accept="image/*"></label><br>
<img id="pf_img" alt="Preview" width="80" hidden><br>
<label>Colour theme: <input type="color" id="pf_c" value="#1f4e79"></label><br>
<button type="submit">Save</button>
</form>
<script>
document.getElementById("pf_c").addEventListener("input", function () {
  this.form.parentNode.style.borderLeft = "8px solid " + this.value;
});
document.getElementById("pf_f").addEventListener("change", function () {
  var img = document.getElementById("pf_img");
  if (this.files[0]) { img.src = URL.createObjectURL(this.files[0]); img.hidden = false; }
});
</script>
</div>
