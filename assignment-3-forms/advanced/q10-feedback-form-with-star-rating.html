<h1>HTML Assignment 3 - Forms (Advanced)</h1>
<h2>Q10. Feedback form with star rating</h2>
<div class="demo">
<form onsubmit="event.preventDefault();alert('Form submitted')">
<fieldset><legend>Rating</legend>
<label><input type="radio" name="star" value="1" required> 1&#9733;</label>
<label><input type="radio" name="star" value="2"> 2&#9733;</label>
<label><input type="radio" name="star" value="3"> 3&#9733;</label>
<label><input type="radio" name="star" value="4"> 4&#9733;</label>
<label><input type="radio" name="star" value="5"> 5&#9733;</label>
</fieldset>
<label>Comments:<br><textarea rows="4" cols="40" name="comment"></textarea></label><br>
<button type="submit">Submit feedback</button>
</form>
</div>
