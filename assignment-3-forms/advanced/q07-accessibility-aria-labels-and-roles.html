<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q7 - Accessibility: ARIA labels and roles</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:20px auto;padding:0 16px;line-height:1.5}
section.q{border:1px solid #ccc;border-radius:6px;padding:12px 16px;margin:16px 0}
h2{font-size:1.05em;color:#1f4e79}
.demo{background:#f7f7f7;padding:10px;margin-top:8px}
label{display:inline-block;margin:4px 0}
input,select,textarea,button{margin:4px 0}
nav.h a{margin-right:12px}
svg,canvas{background:#fff}
figure{display:inline-block;margin:6px}
.err{color:#b00020;font-size:.9em}
</style>
</head>
<body>
<h1>HTML Assignment 3 - Forms (Advanced)</h1>
<h2>Q7. Accessibility: ARIA labels and roles</h2>
<div class="demo">
<form onsubmit="event.preventDefault();alert('Form submitted')" role="form" aria-label="Contact form">
<label for="ar_n">Name</label>
<input type="text" id="ar_n" required aria-required="true"><br>
<label for="ar_e">Email</label>
<input type="email" id="ar_e" aria-required="true" aria-describedby="ar_hint">
<small id="ar_hint">We never share your email.</small><br>
<div role="radiogroup" aria-labelledby="ar_lbl">
<span id="ar_lbl">Preferred contact:</span>
<label><input type="radio" name="pc" value="email"> Email</label>
<label><input type="radio" name="pc" value="phone"> Phone</label>
</div>
<label for="ar_m">Message</label><br>
<textarea id="ar_m" rows="3" cols="40" aria-label="Your message"></textarea><br>
<button type="submit" aria-label="Send the form">Send</button>
</form>
</div>

</body>
