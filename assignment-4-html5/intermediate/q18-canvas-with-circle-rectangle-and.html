<body>
<h1>HTML Assignment 4 - HTML5 (Intermediate)</h1>
<h2>Q18. Canvas with circle, rectangle and line</h2>
<div class="demo">
<canvas id="c18" width="400" height="150" style="border:1px solid #333"></canvas>
<script>
var ctx = document.getElementById("c18").getContext("2d");
ctx.fillStyle = "green";
ctx.fillRect(20, 30, 100, 80);
ctx.beginPath();
ctx.arc(200, 75, 40, 0, 2 * Math.PI);
ctx.fillStyle = "orange";
ctx.fill();
ctx.beginPath();
ctx.moveTo(270, 30);
ctx.lineTo(380, 120);
ctx.stroke();
</script>
</div>
