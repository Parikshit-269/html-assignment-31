<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q9 - Semantic page with inline SVG bar chart</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:20px auto;padding:0 16px;line-height:1.5}
section.q{border:1px solid #ccc;border-radius:6px;padding:12px 16px;margin:16px 0}
h2{font-size:1.05em;color:#1f4e79}
.demo{background:#f7f7f7;padding:10px;margin-top:8px}
label{display:inline-block;margin:4px 0}
input,select,textarea,button{margin:4px 0}
nav.h a{margin-right:12px}
svg,canvas{background:#fff}
figure{display:inline-block;margin:6px}
.err{color:#b00020;font-size:.9em}
</style>
</head>
<body>
<h1>HTML Assignment 4 - HTML5 (Advanced)</h1>
<h2>Q9. Semantic page with inline SVG bar chart</h2>
<div class="demo">
<header><h3>Monthly Sales Report</h3></header>
<main>
<article>
<h4>Sales by Month (units)</h4>
<figure>
<svg width="360" height="170" role="img" aria-label="Bar chart of monthly sales">
<line x1="30" y1="140" x2="350" y2="140" stroke="black" />
<rect x="45" y="80" width="40" height="60" fill="steelblue" />
<text x="65" y="158" font-size="12" text-anchor="middle">Jan</text>
<text x="65" y="74" font-size="11" text-anchor="middle">60</text>
<rect x="105" y="50" width="40" height="90" fill="steelblue" />
<text x="125" y="158" font-size="12" text-anchor="middle">Feb</text>
<text x="125" y="44" font-size="11" text-anchor="middle">90</text>
<rect x="165" y="95" width="40" height="45" fill="steelblue" />
<text x="185" y="158" font-size="12" text-anchor="middle">Mar</text>
<text x="185" y="89" font-size="11" text-anchor="middle">45</text>
<rect x="225" y="20" width="40" height="120" fill="steelblue" />
<text x="245" y="158" font-size="12" text-anchor="middle">Apr</text>
<text x="245" y="14" font-size="11" text-anchor="middle">120</text>
<rect x="285" y="60" width="40" height="80" fill="steelblue" />
<text x="305" y="158" font-size="12" text-anchor="middle">May</text>
<text x="305" y="54" font-size="11" text-anchor="middle">80</text>
</svg>
<figcaption>Bar chart built with SVG &lt;rect&gt; elements</figcaption>
</figure>
</article>
</main>
<footer><small>&copy; 2026 Sales Dept.</small></footer>
</div>
<p><a href="../../index.html">&larr; Back to index</a></p>

</body>
</html>
