<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Q10 - Dashboard with animated canvas graph</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:20px auto;padding:0 16px;line-height:1.5}
section.q{border:1px solid #ccc;border-radius:6px;padding:12px 16px;margin:16px 0}
h2{font-size:1.05em;color:#1f4e79}
.demo{background:#f7f7f7;padding:10px;margin-top:8px}
label{display:inline-block;margin:4px 0}
input,select,textarea,button{margin:4px 0}
nav.h a{margin-right:12px}
svg,canvas{background:#fff}
figure{display:inline-block;margin:6px}

</style>
</head>
<body>
<h1>HTML Assignment 4 - HTML5 (Advanced)</h1>
<h2>Q10. Dashboard with animated canvas graph</h2>
<div class="demo">
<header><h3>Dashboard</h3></header>
<nav><a href="#">Overview</a> | <a href="#">Reports</a> | <a href="#">Settings</a></nav>
<div style="display:flex;gap:16px">
<main style="flex:3">
<h4>Live Traffic</h4>
<canvas id="dash" width="420" height="160" style="border:1px solid #333"></canvas>
</main>
<aside style="flex:1;background:#e8eef5;padding:8px"><h4>Stats</h4><p>Users: 1,240</p><p>Sessions: 3,880</p></aside>
</div>
<footer><small>&copy; 2026 Dashboard</small></footer>
<script>
(function () {
  var c = document.getElementById("dash"), ctx = c.getContext("2d");
  var pts = [];
  for (var i = 0; i < 40; i++) pts.push(80);
  function draw() {
    pts.shift();
    pts.push(Math.max(10, Math.min(150, pts[pts.length - 1] + (Math.random() - 0.5) * 30)));
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var x = i * (c.width / (pts.length - 1));
      if (i === 0) ctx.moveTo(x, pts[i]); else ctx.lineTo(x, pts[i]);
    }
    ctx.strokeStyle = "#1f77b4";
    ctx.lineWidth = 2;
    ctx.stroke();
    setTimeout(function () { requestAnimationFrame(draw); }, 120);
  }
  draw();
})();
</script>
</div>
