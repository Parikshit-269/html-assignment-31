<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:20px auto;padding:0 16px;line-height:1.5}
section.q{border:1px solid #ccc;border-radius:6px;padding:12px 16px;margin:16px 0}

<body>
<h1>HTML Assignment 4 - HTML5 (Advanced)</h1>
<h2>Q7. Two rectangles with linear gradients on canvas</h2>
<div class="demo">
<canvas id="grad" width="320" height="140" style="border:1px solid #333"></canvas>
<script>
var ctx = document.getElementById("grad").getContext("2d");
var g1 = ctx.createLinearGradient(10, 0, 150, 0);
g1.addColorStop(0, "red");
g1.addColorStop(1, "yellow");
ctx.fillStyle = g1;
ctx.fillRect(10, 20, 140, 100);
var g2 = ctx.createLinearGradient(170, 0, 310, 0);
g2.addColorStop(0, "blue");
g2.addColorStop(1, "lime");
ctx.fillStyle = g2;
ctx.fillRect(170, 20, 140, 100);
</script>
</div>
