<h1>HTML Assignment 4 - HTML5 (Basic)</h1>
<h2>Q8. &lt;time&gt; for today&#x27;s date in an event description</h2>
<div class="demo">
<p>Our workshop is today, <time id="today"></time>.</p>
<script>
var d = new Date();
var el = document.getElementById("today");
el.setAttribute("datetime", d.toISOString().slice(0, 10));
el.textContent = d.toDateString();
</script>
</div>
